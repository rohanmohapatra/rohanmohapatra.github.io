gif\",\"alt\":\"\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":\"This version is all about simplification, sanity, and some serious Chakra-fueled energy — now 43% cleaner, 72% sassier, and 100% more fun to work on (scientifically speaking). If v3 was about flexing the stack, v4 is me whispering to my codebase: “let’s just keep it chill this time.”\"}],\"\\n\",[\"$\",\"h2\",null,{\"id\":\"so-whats-new\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-semibold x:target:animate-[fade-in_1.5s] x:mt-10 x:border-b x:pb-1 x:text-3xl nextra-border\",\"children\":[\"So, What’s New?\",[\"$\",\"$L23\",null,{\"id\":\"so-whats-new\"}]]}],\"\\n\",[\"$\",\"h4\",null,{\"id\":\"chakra-ui-fully-unleashed\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-semibold x:target:animate-[fade-in_1.5s] x:mt-8 x:text-xl\",\"children\":[\"Chakra UI: Fully Unleashed\",[\"$\",\"$L23\",null,{\"id\":\"chakra-ui-fully-unleashed\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":\"When I say v4 of my portfolio is powered by Chakra UI v3, I don’t just mean a version bump. I mean a full glow-up. Chakra UI v3 is more SSR-friendly, smaller in bundle size, and just works better with frameworks like Next.js. In v4 of my portfolio, everything feels tighter, faster, and more… predictable (in the best way).\"}],\"\\n\",[\"$\",\"h4\",null,{\"id\":\"goodbye-docusaurus-for-now\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-semibold x:target:animate-[fade-in_1.5s] x:mt-8 x:text-xl\",\"children\":[\"Goodbye Docusaurus (for now…)\",[\"$\",\"$L23\",null,{\"id\":\"goodbye-docusaurus-for-now\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":[\"Docusaurus 2 was great for blogging, but maintaining it alongside a Next.js app felt like living a double life.\\nSo in v4, I’ve replaced Docusaurus with \",[\"$\",\"a\",null,{\"href\":\"https://nextra.site/\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"x:focus-visible:nextra-focus x:text-primary-600 x:underline x:hover:no-underline x:decoration-from-font x:[text-underline-position:from-font]\",\"children\":[\"Nextra\",[\" \",[\"$\",\"svg\",null,{\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"strokeWidth\":1.7,\"viewBox\":\"0 0 24 24\",\"height\":\"1em\",\"className\":\"x:inline x:align-baseline x:shrink-0\",\"children\":[[\"$\",\"path\",null,{\"d\":\"M7 17L17 7\"}],[\"$\",\"path\",null,{\"d\":\"M7 7h10v10\"}]]}]]]}],\" — a lightweight, MDX-powered site generator that just vibes better with Next.js. Now the blog and portfolio finally speak the same language, and everything runs smoother than ever.\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":[\"$\",\"strong\",null,{\"children\":\"Markdown + Next.js = one happy dev (me)\"}]}],\"\\n\",[\"$\",\"h4\",null,{\"id\":\"from-yarn-workspaces-to--one-clean-app\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-semibold x:target:animate-[fade-in_1.5s] x:mt-8 x:text-xl\",\"children\":[\"From Yarn Workspaces to ✨ One Clean App\",[\"$\",\"$L23\",null,{\"id\":\"from-yarn-workspaces-to--one-clean-app\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":\"v3 had a monorepo. It sounded cool. It looked pro. It also made me question everything. Constant context-switching. Mini-packages within packages. Build scripts that looked like ancient incantations. v4 ditches all that and goes solo app mode — no workspaces, no nonsense. Just one beautiful, cozy, single-source-of-truth frontend.\"}],\"\\n\",[\"$\",\"h4\",null,{\"id\":\"why-v4-why-now\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-semibold x:target:animate-[fade-in_1.5s] x:mt-8 x:text-xl\",\"children\":[\"Why v4? Why now?\",[\"$\",\"$L23\",null,{\"id\":\"why-v4-why-now\"}]]}],\"\\n\",[\"$\",\"ul\",null,{\"className\":\"x:[:is(ol,ul)_\u0026]:my-3 x:not-first:mt-6 x:list-disc x:ms-6\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"x:my-2\",\"children\":\"Because simpler \u003e smarter.\"}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"x:my-2\",\"children\":\"Because maintaining multiple frontend tools was draining the fun.\"}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"x:my-2\",\"children\":\"Because I’d rather write content than config.\"}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"x:my-2\",\"children\":\"Because I wanted a portfolio that feels like me — clean, fast, focused, and flexible.\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h4\",null,{\"id\":\"migration-madness-blog-coming-soon\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-semibold x:target:animate-[fade-in_1.5s] x:mt-8 x:text-xl\",\"children\":[\"Migration Madness (Blog Coming Soon™)\",[\"$\",\"$L23\",null,{\"id\":\"migration-madness-blog-coming-soon\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":[\"Chakra UI v3 migration? A wild ride. Equal parts refactor and ritual cleansing. How I felt while doing the migration.\\n\",[\"$\",\"$L22\",null,{\"src\":\"https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcmsxdnBwM3VodXdkdHQzMDJhaHRlNnRlZ2k0OThodW56NzVueHRxMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/XbbSxbfQ2HVNVHZWW8/giphy.gif\",\"alt\":\"\"}]]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"x:not-first:mt-6 x:leading-7\",\"children\":\"A full “How I Survived the Chakra UI v3 Migration” blog post is in the works, featuring:\"}],\"\\n\",[\"$\",\"ol\",null,{\"className\":\"x:[:is(ol,ul)_\u0026]:my-3 x:not-first:mt-6 x:list-decimal x:ms-6\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"x:my-2\",\"children\":\"Chakra UI tears (and triumphs) 😭\"}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"x:my-2\",\"children\":\"Ditching Docusa
